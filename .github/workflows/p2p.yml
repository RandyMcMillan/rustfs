name: RustFS P2P Features Test

on:
  pull_request:
    branches: [ main ]
    paths:
      - "Cargo.toml"
      - "rustfs/Cargo.toml"
      - "rustfs/src/p2p/**"
      - "crates/ecstore/src/cluster/**"
      - "crates/ecstore/src/api/mod.rs"
      - "rustfs/src/storage/storage_api.rs"
      - "rustfs/src/startup_services.rs"
      - "rustfs/src/startup_lifecycle.rs"
      - "scripts/test_p2p_features.sh"
      - ".github/workflows/p2p.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  p2p-features:
    name: P2P Features
    runs-on: sm-standard-2
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7
        with:
          persist-credentials: false

      - name: Setup Rust environment
        uses: ./.github/actions/setup
        with:
          rust-version: stable
          cache-shared-key: ci-dev
          cache-save-if: 'false'
          install-build-packaging-tools: 'false'

      - name: Run P2P feature tests
        run: bash ./scripts/test_p2p_features.sh